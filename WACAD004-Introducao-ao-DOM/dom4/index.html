<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>

    <style>

        #app-tarefas {
            border: 2px solid black;
            padding: 10px;
            width: 300px;
        }

    </style>

</head>

<body>

    <div id="app-tarefas">

        <h3>Minhas Tarefas</h3>


        <input
            type="text"
            id="input-nova-tarefa"
            placeholder="Digite uma tarefa..."
        >


        <button id="btn-adicionar">
            Adicionar Tarefa
        </button>


        <ul id="lista-tarefas">
            <li>Revisar código da aula passada</li>
        </ul>

    </div>

    <script>


        const input = document.querySelector("#input-nova-tarefa");

        const botao = document.querySelector("#btn-adicionar");

        const lista = document.querySelector("#lista-tarefas");


        botao.addEventListener("click", function () {


            const textoTarefa = input.value;


            if (textoTarefa === "") {
                return;
            }


            const novaTarefa = document.createElement("li");


            novaTarefa.innerText = textoTarefa;


            lista.appendChild(novaTarefa);


            input.value = "";

        });

    </script>

</body>

</html>
